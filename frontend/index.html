<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Green Valley School Maps</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- ================= HEADER ================= -->
    <header id="header"></header>
    <script>
        fetch("iframes/Header/header.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            })
            .catch(err => console.error("Header load failed:", err));
    </script>

    <!-- ================= MAIN ================= -->

    <main class="flex-1 flex overflow-hidden h-[calc(100vh-73px)]">

        <!-- ================= MAP SECTION ================= -->

        <section class="map-container flex-1 flex flex-col p-4 gap-4 relative">

            <!-- Toolbar -->

            <div id="toolbars"></div>
            <script>
                fetch("iframes/NavigationButtons/toolbars.html")
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById("toolbars").innerHTML = data;
                    })
                    .catch(err => console.error("Toolbars load failed:", err));
            </script>

            <!-- Campus CampusMap -->
            <div
                id="map"
                class="campus-map flex-1 bg-green-50 rounded-xl border-2 border-dashed border-gray-200 flex items-center justify-center relative overflow-hidden"></div>
            <script>
                fetch("iframes/CampusMap/map.html")
                    .then(res => res.text())
                    .then(data => {
                        document.getElementById("map").innerHTML = data;
                    })
                    .catch(err => console.error("Map load failed:", err));
            </script>

        </section>

        <!-- ================= BUILDING INFO ================= -->

        <aside id="buildingInfo"></aside>
        <script>
            fetch("iframes/NavigationButtons/buildingInfo.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("buildingInfo").innerHTML = data;
                })
                .catch(err => console.error("Building Info load failed:", err));
        </script>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
