<!DOCTYPE html>
<html lang="en">
<aside
        class="building-info w-96 bg-white border-l border-gray-200 p-6 flex flex-col justify-between h-full">

    <div class="space-y-6">

        <div class="building-header border-b pb-4">

                    <span
                            class="inline-block text-xs font-semibold uppercase tracking-wider text-green-700 bg-green-100 px-2 py-1 rounded mb-2">

                        Administrative

                    </span>

            <h2 id="buildingName" class="text-xl font-bold text-gray-800">
                Main Building
            </h2>

            <p class="text-sm text-gray-500">

                Select a building on the map.

            </p>

        </div>

        <div
                class="building-image h-40 bg-gray-100 rounded-lg overflow-hidden flex items-center justify-center border border-gray-200">

            <i class="fa-solid fa-image text-gray-300 text-3xl"></i>

        </div>

        <div class="building-details space-y-3">

            <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">
                Offices
            </h3>
            <ul id="buildingOffices" class="space-y-2 text-sm text-gray-600">
                <!-- Offices will be injected here by JS -->
            </ul>

            <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">
                Rooms
            </h3>
            <ul id="buildingRooms" class="space-y-2 text-sm text-gray-600">
                <!-- Rooms will be injected here by JS -->
            </ul>

        </div>

    </div>

</aside>
</html>
